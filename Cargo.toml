[workspace]
members = ["programs/flip-vault"]
resolver = "2"

[workspace.dependencies]
pinocchio = { version = "0.10.2", default-features = false, features = ["cpi", "alloc", "copy"] }
pinocchio-log = "0.5.1"
pinocchio-system = { version = "0.5.0", default-features = false }
pinocchio-token = { version = "0.5.0", default-features = false }
ephemeral-rollups-pinocchio = { version = "0.16.2", default-features = false }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
